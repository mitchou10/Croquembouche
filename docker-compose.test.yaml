# The database the backend tests run against: `docker compose -f docker-compose.test.yaml up -d --wait`.
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: croquembouche
      POSTGRES_PASSWORD: croquembouche
      POSTGRES_DB: croquembouche
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U croquembouche"]
      interval: 3s
      timeout: 3s
      retries: 10
