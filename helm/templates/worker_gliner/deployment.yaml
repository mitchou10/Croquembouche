{{- if .Values.enabled }}
{{- if eq .Values.worker_gliner.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_gliner") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_gliner")) | nindent 4 }}
spec:
  {{- if not .Values.worker_gliner.autoscaling.enabled }}
  replicas: {{ .Values.worker_gliner.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker_gliner.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_gliner") | nindent 6 }}
  strategy:
    type: {{ .Values.worker_gliner.strategy.type }}
    {{- if eq .Values.worker_gliner.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.worker_gliner.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.worker_gliner.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_gliner" "component" .Values.worker_gliner) | nindent 4 }}
{{- end }}
{{- end }}
