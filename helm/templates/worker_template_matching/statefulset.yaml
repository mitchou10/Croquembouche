{{- if .Values.enabled }}
{{- if eq .Values.worker_template_matching.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_template_matching") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "worker_template_matching") | nindent 4 }}
spec:
  {{- if not .Values.worker_template_matching.autoscaling.enabled }}
  replicas: {{ .Values.worker_template_matching.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker_template_matching.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_template_matching") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_template_matching") }}
  {{- with .Values.worker_template_matching.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_template_matching" "component" .Values.worker_template_matching) | nindent 4 }}
  {{- if or .Values.worker_template_matching.volumeClaims .Values.worker_template_matching.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.worker_template_matching.volumeClaims) (default (list) .Values.worker_template_matching.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
