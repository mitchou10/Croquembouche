{{- if .Values.enabled }}
{{- if eq .Values.worker_template_matching.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_template_matching") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_template_matching")) | nindent 4 }}
spec:
  {{- if not .Values.worker_template_matching.autoscaling.enabled }}
  replicas: {{ .Values.worker_template_matching.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker_template_matching.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_template_matching") | nindent 6 }}
  strategy:
    type: {{ .Values.worker_template_matching.strategy.type }}
    {{- if eq .Values.worker_template_matching.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.worker_template_matching.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.worker_template_matching.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_template_matching" "component" .Values.worker_template_matching) | nindent 4 }}
{{- end }}
{{- end }}
