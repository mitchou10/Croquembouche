[project]
name = "croquembouche-worker-gliner"
version = "1.24.0"
description = "Croquembouche GLiNER worker: finds the entities that have no zone in the text the OCR read"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "codecarbon>=3.0",
    "gliner>=0.2.22",
    "protobuf>=5.0",
    "redis>=8.1.0",
    "sentencepiece>=0.2.0",
    "torch>=2.4",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# torch from its CPU index: the one of PyPI carries the CUDA libraries (gigabytes) a CPU worker never loads.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
