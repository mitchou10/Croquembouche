[project]
name = "croquembouche-worker-template-matching"
version = "1.0.0"
description = "Croquembouche template matching worker"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "packaging>=26.3",
    "redis>=8.1.0",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
