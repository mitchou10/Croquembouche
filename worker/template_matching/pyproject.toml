[project]
name = "croquembouche-worker-template-matching"
version = "1.11.0"
description = "Croquembouche template matching worker"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.123",
    "celery>=5.6.3",
    "fastembed>=0.9.1",
    "opencv-python-headless>=5.0.0.93",
    "packaging>=26.3",
    "pillow>=13.0.0",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
]
dev = [{ include-group = "test" }]

[tool.pytest.ini_options]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
