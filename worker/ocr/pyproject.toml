[project]
name = "croquembouche-worker-ocr"
version = "1.19.0"
description = "Croquembouche OCR worker (PaddleOCR, CPU)"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.123",
    "celery>=5.6.3",
    "codecarbon>=3.0",
    "numpy>=2.0",
    "opencv-python-headless>=5.0.0.93",
    "paddleocr>=3.2.0",
    "paddlepaddle>=3.2.0",
    "redis>=8.1.0",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
