[project]
name = "croquembouche-backend"
version = "1.0.0"
description = "Croquembouche backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.123",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-keycloak>=7.1.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-dotenv>=0.5.2",
    "fakeredis>=2.40.0",
    "pillow>=13.0.0",
]
dev = [
    { include-group = "test" },
    "eralchemy>=1.7.0",
    "graphviz>=0.21",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated by Alembic.
"migrations/versions/*" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env_files = ["tests/.env.testing"]
