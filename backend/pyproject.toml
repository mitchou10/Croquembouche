[project]
name = "croquembouche-backend"
version = "1.1.0"
description = "Croquembouche backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "python-keycloak>=7.1.1",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-dotenv>=0.5.2",
    "fakeredis>=2.40.0",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env_files = ["tests/.env.testing"]
