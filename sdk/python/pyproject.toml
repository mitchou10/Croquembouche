[project]
name = "croquembouche-sdk"
version = "1.25.0"
description = "Python client for the Croquembouche API: the catalogue of models, the analyses and the search for similar documents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../../LICENSE" }
dependencies = ["httpx2>=2.13.1,<3", "attrs>=22.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/croquembouche"]

[dependency-groups]
dev = [
    "openapi-python-client==0.30.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/croquembouche/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# `timeout=` is the point of `wait()`: it ends by raising, as a deadline is meant to.
ignore = ["ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["e2e: runs against a running backend (CROQUEMBOUCHE_URL)"]
