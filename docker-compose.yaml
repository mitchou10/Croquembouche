# Production-like stack: the images as they ship.
#   docker compose -f docker-compose.yaml up --build
#   frontend  http://localhost:8080
#   backend   http://localhost:8000/api/health
#
# A plain `docker compose up` also reads docker-compose.override.yaml: the development stack, where edits to the
# frontend and the backend show up without rebuilding.
services:
  frontend:
    build:
      context: frontend
      target: runtime
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: backend
      target: runtime
    environment:
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      # What the browser reaches Keycloak on: the host port published below.
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_REALM: croquembouche
      KEYCLOAK_CLIENT_ID: croquembouche-backend
      KEYCLOAK_CLIENT_SECRET: dev-only-secret-not-for-prod
      # The fixed redirect_uri registered in Keycloak is {BACKEND_PUBLIC_URL}/api/auth/callback; the browser lands on
      # FRONTEND_URL after login. Both are the frontend's origin: it forwards /api to the backend.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SESSION_COOKIE_SECURE: "false"
      # RustFS, the S3 of the development stack: the uploaded documents and the screenshots of their pages.
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_BUCKET: croquembouche-documents
      DATABASE_URL: postgresql+asyncpg://croquembouche:croquembouche@postgres:5432/croquembouche
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Brings the database to the schema of the code before the backend starts.
  migrate:
    build:
      context: backend
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://croquembouche:croquembouche@postgres:5432/croquembouche
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: croquembouche
      POSTGRES_PASSWORD: croquembouche # dev only
      POSTGRES_DB: croquembouche
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U croquembouche"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker-template-matching:
    build:
      context: worker/template_matching
      target: runtime
    environment:
      REDIS_URL: redis://redis:6379/0
      # The vector store the catalogue is indexed in, and the image embedding model (downloaded on first use into the
      # volume below, so that a restart does not download it again).
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qdrant/clip-ViT-B-32-vision}
      EMBEDDING_CACHE_DIR: /home/worker/.cache/fastembed
      # The page images it reads: the object store of the backend.
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_BUCKET: croquembouche-documents
    volumes:
      - worker-models:/home/worker/.cache
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333" # REST, and the dashboard on /dashboard
    healthcheck:
      # The image has no curl: a connection to the port is what tells it is up.
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # The URL the browser reaches Keycloak on, scheme included: a bare host name would make it https.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./docker/keycloak/realm-croquembouche.json:/opt/keycloak/data/import/realm-croquembouche.json:ro
    # 8180 on the host: 8080 is the frontend's.
    ports:
      - "8180:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # RustFS's image runs as non-root (uid 10001) while a named volume belongs to root: this one-shot fixes that first.
  rustfs-volume-permissions:
    image: alpine
    volumes:
      - rustfs-data:/data
    command: chown -R 10001:10001 /data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin # dev only
      RUSTFS_SECRET_KEY: rustfsadmin # dev only
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  postgres-data:
  qdrant-data:
  rustfs-data:
  worker-models:
