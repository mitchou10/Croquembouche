title = "croquembouche gitleaks config"

# `targetRules` on a global allowlist needs v8.25.0.
minVersion = "v8.25.0"

[extend]
useDefault = true

# Allowlisting by rule + path is SHA-independent: a gitleaks git-mode fingerprint is `<commit>:<file>:<rule>:<line>`,
# so one kept in a `.gitleaksignore` is orphaned by every rebase, amend or squash of the branch carrying the line.
[[allowlists]]
targetRules = ["kubernetes-secret-yaml"]
description = "Chart test fixture exercising the `extraObjects` templating path."
# The built-in rule matches on YAML shape (a `my-secret:`-like key holding a block scalar with `kind: Secret` +
# `data:`), never on the block's actual values. It fires on helm/test-values.yaml's `extraObjects.my-secret` fixture,
# which exists solely to exercise the chart's `extraObjects` path: its "password" is a literal string piped through
# `b64enc`, not real secret material.
paths = ['''^helm/test-values\.yaml$''']
