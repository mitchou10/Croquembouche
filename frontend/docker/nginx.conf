server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend, on the page's own origin: the session cookie never leaves it, and there is no CORS to configure.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: let Vue Router (history mode) own client-side paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
