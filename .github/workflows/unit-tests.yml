name: Unit Tests

# Every service runs its tests with coverage, then ci/crap.py turns the lcov report
# into a CRAP score per function (complexity^2 * (1 - coverage)^3 + complexity).
# It only reports until the repository variable CRAP_BLOCKING is set to `true`;
# CRAP_THRESHOLD (default 30) is the score above which a function fails the job.
# The backend tests need a database (a service of `unit-tests-backend`); add the other services they need there.

on:
  workflow_call:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend tests
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run backend tests
        required: false
        type: string
        default: "3.13"
  workflow_dispatch:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend tests
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run backend tests
        required: false
        type: string
        default: "3.13"

env:
  CRAP_THRESHOLD: ${{ vars.CRAP_THRESHOLD || '30' }}
  CRAP_FAIL: ${{ vars.CRAP_BLOCKING == 'true' && '--fail' || '' }}

jobs:
  unit-tests-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Vitest with @vitest/coverage-v8, reporters: ['text', 'lcov'] -> frontend/coverage/lcov.info
      - name: Run tests
        working-directory: frontend
        run: pnpm run test:coverage

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: CRAP score
        run: uvx --from lizard==1.17.13 python ci/crap.py --src frontend/src --root frontend --lcov frontend/coverage/lcov.info --name frontend $CRAP_FAIL

  unit-tests-backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The same database as docker-compose.test.yaml: the tests build its schema from the migrations.
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: croquembouche
          POSTGRES_PASSWORD: croquembouche
          POSTGRES_DB: croquembouche
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U croquembouche"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      # The SDK is installed beside the backend for the tests that use it against the application (tests/test_sdk.py);
      # it is not a dependency of the backend.
      - name: Run tests
        working-directory: backend
        run: uv run --with ../sdk/python pytest --cov=app --cov-report=term-missing --cov-report=lcov:coverage.lcov

      - name: CRAP score
        run: uvx --from lizard==1.17.13 python ci/crap.py --src backend/app --root backend --lcov backend/coverage.lcov --name backend $CRAP_FAIL

  unit-tests-sdk:
    name: SDK (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            sdk/python/uv.lock
            backend/uv.lock

      - name: Install SDK dependencies
        working-directory: sdk/python
        run: uv sync --group dev

      - name: Lint
        working-directory: sdk/python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The client is generated from the OpenAPI of the backend: what is committed must be what the API gives today.
      - name: The generated client is up to date
        run: |
          sdk/python/scripts/generate.sh
          git status --porcelain -- sdk
          test -z "$(git status --porcelain -- sdk)" || { echo "Run sdk/python/scripts/generate.sh and commit the result."; exit 1; }

      - name: Run tests
        working-directory: sdk/python
        run: uv run pytest

      # What a user gets: the package installed from Git as `uv add` does (the revision under test), and the same tests
      # run against that installed copy, not against the sources.
      - name: Tests of the installed package
        run: |
          uv venv "$RUNNER_TEMP/released"
          uv pip install --python "$RUNNER_TEMP/released/bin/python" pytest pytest-asyncio \
            "croquembouche-sdk @ git+file://$GITHUB_WORKSPACE@$(git rev-parse HEAD)#subdirectory=sdk/python"
          "$RUNNER_TEMP/released/bin/python" -c "import croquembouche; print(croquembouche.__file__, croquembouche.__version__)"
          cd sdk/python && "$RUNNER_TEMP/released/bin/python" -m pytest tests -p no:cacheprovider

  unit-tests-sdk-typescript:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdk/typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: sdk/typescript
        run: pnpm run typecheck

      # The types are generated from the OpenAPI of the backend: what is committed must be what the API gives today. So
      # must the built package (dist/): it is what is installed from Git, which has nothing to build it with.
      - name: The generated types and the built package are up to date
        run: |
          sdk/typescript/scripts/generate.sh
          pnpm --dir sdk/typescript run build
          git status --porcelain -- sdk
          test -z "$(git status --porcelain -- sdk)" || { echo "Run sdk/typescript/scripts/generate.sh and commit the result."; exit 1; }

      - name: Run tests
        working-directory: sdk/typescript
        run: pnpm run test

      # What a user gets: the package installed from Git as `pnpm add` does (at the revision under test), and its types and
      # code used from a project of its own.
      - name: The installed package
        run: |
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          pnpm add "croquembouche-sdk@git+file://$GITHUB_WORKSPACE#$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)&path:/sdk/typescript"
          pnpm add -D typescript@~6.0.3 @types/node
          cat > check.ts <<'TS'
          import { Croquembouche, NotFoundError, type TemplateOut } from 'croquembouche-sdk'
          const client = new Croquembouche('http://localhost', { token: 'x' })
          const read: Promise<TemplateOut> = client.templates.get('t1')
          // The types of the package are real ones, not `any` for want of a file.
          type IsAny<T> = 0 extends 1 & T ? true : false
          const typed: IsAny<TemplateOut> extends false ? true : never = true
          console.log(typeof read.then, typed, new NotFoundError(404, 'x').name)
          TS
          pnpm exec tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 --types node check.ts
          node --experimental-strip-types --no-warnings check.ts

  unit-tests-worker-template-matching:
    name: worker/template_matching
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/template_matching/uv.lock

      - name: Install worker dependencies
        working-directory: worker/template_matching
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/template_matching
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=lcov:coverage.lcov

      - name: CRAP score
        run: uvx --from lizard==1.17.13 python ci/crap.py --src worker/template_matching/app --root worker/template_matching --lcov worker/template_matching/coverage.lcov --name worker/template_matching $CRAP_FAIL

  unit-tests-worker-ocr:
    name: worker/ocr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/ocr/uv.lock

      - name: Install worker dependencies
        working-directory: worker/ocr
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/ocr
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=lcov:coverage.lcov

      - name: CRAP score
        run: uvx --from lizard==1.17.13 python ci/crap.py --src worker/ocr/app --root worker/ocr --lcov worker/ocr/coverage.lcov --name worker/ocr $CRAP_FAIL

  unit-tests-worker-gliner:
    name: worker/gliner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/gliner/uv.lock

      - name: Install worker dependencies
        working-directory: worker/gliner
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/gliner
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=lcov:coverage.lcov

      - name: CRAP score
        run: uvx --from lizard==1.17.13 python ci/crap.py --src worker/gliner/app --root worker/gliner --lcov worker/gliner/coverage.lcov --name worker/gliner $CRAP_FAIL
